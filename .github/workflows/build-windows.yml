# =====================================================
# GitHub Actions：自动在 Windows 上编译出 .msi / .exe
# 推送到 GitHub 后，Actions 自动编译，你直接下载安装包
# =====================================================

name: Build Windows

on:
  push:
    branches: [main]      # push 到 main 自动触发
    tags: ['v*']          # 打 tag 也触发
  workflow_dispatch:       # 手动触发

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: npm install

      - name: Build Tauri app
        run: npm run tauri:build
        # 注意：发布签名版本时，需要在仓库 Settings → Secrets 添加 TAURI_SIGNING_KEY，
        # 然后取消下面这行的注释：
        # env:
        #   TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_KEY }}

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: ShidianPin-windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi

      - name: Upload NSIS EXE
        uses: actions/upload-artifact@v4
        with:
          name: ShidianPin-windows-exe
          path: src-tauri/target/release/bundle/nsis/*.exe
